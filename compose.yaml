services:
  desk:
    build: ./desk
    environment:
      SEED_EDITION: ${SEED_EDITION:-1}
    volumes:
      - edition:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/articles?limit=1', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
  site:
    build: ./web
    depends_on:
      desk:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEWSROOM_PORT:-18792}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 10s
      start_interval: 2s
      timeout: 8s
      retries: 5
  telegram:
    profiles: ["live"]
    build: ./desk
    command: ["python", "newsroom.py", "live"]
    restart: on-failure
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_SESSION
      - TELEGRAM_CHANNELS
      - EDITOR_MODE
      - GEMINI_API_KEY
      - GEMINI_MODEL
    volumes:
      - edition:/data
    depends_on:
      desk:
        condition: service_healthy
volumes:
  edition:
